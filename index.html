<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مغامرة الثوب الكحلي - القفز اللانهائي</title>
    <style>
        /* تنسيق الصفحة */
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            touch-action: none;
        }

        /* حاوية اللعبة */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 800px;
            background-color: #e0f7fa; 
            background-image: 
                linear-gradient(rgba(178, 235, 242, 0.6) 1px, transparent 1px),
                linear-gradient(90deg, rgba(178, 235, 242, 0.6) 1px, transparent 1px);
            background-size: 20px 20px;
            image-rendering: pixelated;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* واجهة المستخدم - النقاط */
        #ui {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 0 #fff;
            z-index: 10;
            pointer-events: none;
        }

        /* شاشة البداية والنهاية */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            color: white;
        }

        #overlay h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #000;
        }
        
        #overlay p {
            font-size: 1.2em;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        #start-button {
            padding: 15px 40px;
            font-size: 24px;
            background-color: #000080;
            color: white;
            border: 3px solid #fff;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 4px 0 #fff;
        }
        
        #start-button:active {
            transform: translate(0, 4px);
            box-shadow: 0 0 0 #fff;
        }

        /* أزرار التحكم باللمس */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 15;
            user-select: none;
        }

        .touch-button {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.6);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .touch-button:active {
            background-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">النقاط: <span id="score">0</span></div>
        
        <div id="overlay">
            <h1 id="game-title">مغامرة الثوب الكحلي</h1>
            <p id="game-desc">اقفز تلقائياً! وجه يميناً ويساراً.<br>اجمع الريد بول لقفزة خارقة!</p>
            <button id="start-button">العب الآن</button>
        </div>

        <div class="controls">
            <div class="touch-button" id="btn-right">→</div>
            <div class="touch-button" id="btn-left">←</div>
        </div>
    </div>

    <script>
        // --- إعدادات اللعبة ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const startButton = document.getElementById('start-button');
        const overlayTitle = document.getElementById('game-title');
        const overlayDesc = document.getElementById('game-desc');

        // دقة الشاشة
        const GAME_WIDTH = 320;
        const GAME_HEIGHT = 500;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        // متغيرات اللعبة
        let gameState = 'start'; 
        let score = 0;
        let platforms = [];
        let redBulls = [];
        let platformCount = 7; 
        let bgOffset = 0; 

        // ==========================================
        // 🔴🔴 هنا مكان صورتك 🔴🔴
        // ==========================================
        const playerImg = new Image();
        
        // ضع اسم صورتك هنا، تأكد أنها بصيغة PNG وخلفيتها شفافة
        // وإذا كانت الصورة في نفس المجلد، اكتب اسمها فقط زي كذا:
        playerImg.src = 'player.png'; 
        // ==========================================

        // --- كائنات اللعبة ---

        // اللاعب
        const player = {
            x: GAME_WIDTH / 2 - 25,
            y: GAME_HEIGHT - 100,
            
            // يمكنك تعديل العرض والطول هنا إذا حسيت صورتك ممطوطة أو صغيرة
            width: 55,  
            height: 90, 
            
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpStrength: -10,      // القفزة العادية
            superJumpStrength: -20, // قفزة الريد بول
            gravity: 0.4,
            facingRight: true
        };

        // --- التحكم ---
        const keys = { right: false, left: false };

        // لوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'ArrowLeft') keys.left = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'ArrowLeft') keys.left = false;
        });

        // اللمس
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        const addTouchListeners = (element, key) => {
            element.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            element.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            element.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
            element.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
            element.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
        };

        addTouchListeners(btnLeft, 'left');
        addTouchListeners(btnRight, 'right');

        startButton.addEventListener('click', startGame);

        // --- منطق اللعبة ---

        function initPlatforms() {
            platforms = [];
            redBulls = [];
            
            // منصة البداية
            platforms.push({ x: GAME_WIDTH / 2 - 30, y: GAME_HEIGHT - 30, w: 60, h: 10 });
            
            for (let i = 1; i < platformCount; i++) {
                spawnPlatform(GAME_HEIGHT - 30 - (i * (GAME_HEIGHT / platformCount)));
            }
        }

        function spawnPlatform(yPos) {
            let pWidth = 60;
            let pX = Math.random() * (GAME_WIDTH - pWidth);
            platforms.push({ x: pX, y: yPos, w: pWidth, h: 10 });

            // فرصة 10% لظهور ريد بول
            if (yPos < GAME_HEIGHT - 100 && Math.random() < 0.1) {
                redBulls.push({
                    x: pX + pWidth / 2 - 10,
                    y: yPos - 36,
                    w: 20, // عرض الريد بول
                    h: 34, // ارتفاع الريد بول
                    active: true
                });
            }
        }

        function startGame() {
            gameState = 'playing';
            overlay.style.display = 'none';
            score = 0;
            scoreElement.textContent = Math.floor(score);
            
            player.x = GAME_WIDTH / 2 - player.width / 2;
            player.y = GAME_HEIGHT - 150;
            player.velocityY = player.jumpStrength; 
            
            keys.left = false;
            keys.right = false;

            initPlatforms();
            gameLoop();
        }

        function gameOver() {
            gameState = 'lost';
            overlay.style.display = 'flex';
            overlayTitle.textContent = 'سقطت!';
            overlayDesc.innerHTML = `لقد حققت:<br><b style="font-size:2em">${Math.floor(score)}</b><br>نقطة!`;
            startButton.textContent = 'العب مرة أخرى';
        }

        function update() {
            if (gameState !== 'playing') return;

            // 1. حركة اللاعب الأفقية
            if (keys.right) {
                player.velocityX = player.speed;
                player.facingRight = true;
            } else if (keys.left) {
                player.velocityX = -player.speed;
                player.facingRight = false;
            } else {
                player.velocityX *= 0.7; // احتكاك الهواء
            }

            player.x += player.velocityX;
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            // 2. اختراق الشاشة (Screen Wrap)
            if (player.x > GAME_WIDTH) {
                player.x = -player.width;
            } else if (player.x + player.width < 0) {
                player.x = GAME_WIDTH;
            }

            // 3. التحقق من الاصطدام بالمنصات (عند الهبوط فقط)
            if (player.velocityY > 0) {
                for (let i = 0; i < platforms.length; i++) {
                    let p = platforms[i];
                    if (player.y + player.height > p.y && 
                        player.y + player.height < p.y + p.h + player.velocityY && 
                        player.x + player.width > p.x && 
                        player.x < p.x + p.w) {
                        
                        player.velocityY = player.jumpStrength;
                        player.y = p.y - player.height; 
                        break; 
                    }
                }
            }

            // 4. جمع الريد بول
            for (let i = 0; i < redBulls.length; i++) {
                let rb = redBulls[i];
                if (rb.active && 
                    player.x < rb.x + rb.w && 
                    player.x + player.width > rb.x && 
                    player.y < rb.y + rb.h && 
                    player.y + player.height > rb.y) {
                    
                    rb.active = false; 
                    player.velocityY = player.superJumpStrength; // قفزة خارقة!
                }
            }

            // 5. تحريك الكاميرا
            if (player.y < GAME_HEIGHT / 2) {
                let diff = (GAME_HEIGHT / 2) - player.y;
                player.y = GAME_HEIGHT / 2; 
                
                score += diff * 0.1; 
                scoreElement.textContent = Math.floor(score);
                
                bgOffset += diff * 0.5; 
                document.getElementById('game-container').style.backgroundPosition = `0px ${bgOffset}px`;

                platforms.forEach(p => p.y += diff);
                redBulls.forEach(rb => rb.y += diff);
            }

            // 6. إدارة المنصات
            platforms = platforms.filter(p => p.y < GAME_HEIGHT + 50);
            redBulls = redBulls.filter(rb => rb.y < GAME_HEIGHT + 50 && rb.active);

            while (platforms.length < platformCount) {
                let highestY = Math.min(...platforms.map(p => p.y));
                spawnPlatform(highestY - (GAME_HEIGHT / platformCount));
            }

            // 7. الخسارة (السقوط)
            if (player.y > GAME_HEIGHT) {
                gameOver();
            }
        }

        // --- وظائف الرسم ---

        function draw() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            drawPlatforms();
            drawRedBulls();
            drawPlayer();
        }

        function drawPlayer() {
            // إذا لم يتم تحميل الصورة بعد أو كان المسار غير صحيح (مربع كحلي مؤقت كبديل)
            if (!playerImg.complete || playerImg.naturalWidth === 0) {
                ctx.fillStyle = '#141f36';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                
                // إضافة عينين للتوضيح المؤقت للاتجاه
                ctx.fillStyle = 'white';
                let eyeX = player.facingRight ? player.x + 30 : player.x + 10;
                ctx.fillRect(eyeX, player.y + 10, 10, 10);
                return;
            }

            // رسم صورتك الشفافة!
            if (player.facingRight) {
                ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
            } else {
                // الكود هذا يعكس صورتك أفقياً لما تلف يسار عشان تكون واقعية
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(playerImg, -player.x - player.width, player.y, player.width, player.height);
                ctx.restore();
            }
        }

        function drawPlatforms() {
            platforms.forEach(p => {
                ctx.fillStyle = '#4CAF50'; // العشب
                ctx.fillRect(p.x, p.y, p.w, 4); 
                
                ctx.fillStyle = '#8D6E63'; // التراب
                ctx.fillRect(p.x, p.y + 4, p.w, p.h - 4);
                
                ctx.fillStyle = '#5D4037'; // تفاصيل التربة
                ctx.fillRect(p.x + 10, p.y + 6, 10, 2);
                ctx.fillRect(p.x + 30, p.y + 8, 15, 2);
            });
        }

        // رسم الريد بول بشكل واقعي
        function drawRedBulls() {
            redBulls.forEach(rb => {
                if (!rb.active) return;
                const x = rb.x;
                const y = rb.y;
                const w = rb.w;
                const h = rb.h;

                ctx.save();
                ctx.translate(x, y);

                // 1. خلفية العلبة (فضي)
                ctx.fillStyle = '#c0c0c0';
                ctx.fillRect(0, 0, w, h);

                // 2. الشكل الأزرق المائل
                ctx.fillStyle = '#0f4c81';
                
                // الأزرق العلوي الأيسر
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(w * 0.8, 0);
                ctx.lineTo(0, h * 0.6);
                ctx.fill();

                // الأزرق السفلي الأيمن
                ctx.beginPath();
                ctx.moveTo(w, h);
                ctx.lineTo(w * 0.2, h);
                ctx.lineTo(w, h * 0.4);
                ctx.fill();

                // 3. الشمس الصفراء في المنتصف
                ctx.fillStyle = '#fdd835'; 
                ctx.beginPath();
                ctx.arc(w/2, h/2, w*0.25, 0, Math.PI * 2);
                ctx.fill();

                // 4. الثيران الحمراء (بشكل مبسط)
                ctx.fillStyle = '#e32636';
                ctx.fillRect(w/2 - w*0.35, h/2 - 2, w*0.3, 4); // الأيسر
                ctx.fillRect(w/2 + w*0.05, h/2 - 2, w*0.3, 4); // الأيمن

                // 5. الغطاء العلوي للعلبة
                ctx.fillStyle = '#a0a0a0';
                ctx.fillRect(0, 0, w, 3);
                ctx.fillStyle = '#606060';
                ctx.fillRect(w/2 - 2, 0, 4, 2); // فتحة العلبة

                ctx.restore();
            });
        }

        // --- حلقة اللعبة ---
        function gameLoop() {
            update();
            draw();
            if (gameState === 'playing') {
                requestAnimationFrame(gameLoop);
            }
        }

        // الرسم الأولي
        drawPlayer();

    </script>
</body>
</html>
